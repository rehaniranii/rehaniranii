name: Refresh profile cards

on:
  schedule:
    - cron: "17 0 * * *" # daily, 00:17 UTC
  workflow_dispatch:
  push:
    paths: [render.py, assets/**, fonts/**, data/query.graphql]

permissions:
  contents: write

concurrency: cards

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api graphql -F login="${{ github.repository_owner }}" -F query=@data/query.graphql > data/github.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render cards
        run: |
          pip install fonttools==4.68.0
          python render.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/github.json cards
          git diff --cached --quiet || { git commit -m "Refresh profile cards"; git push; }
